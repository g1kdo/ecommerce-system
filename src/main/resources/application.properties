spring.application.name=ecommerce

# Profile is chosen here so a plain `mvn spring-boot:run` starts against the
# developer database; override with --spring.profiles.active=prod on deploy.
spring.profiles.active=dev

server.port=8080
server.servlet.context-path=/

# ---------- JPA (profile-independent) ----------
# Lazy associations must never be resolved during response serialization; the
# service layer maps to DTOs while the transaction is still open.
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
# Batch order-item inserts issued by a single placeOrder transaction.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Connection pool ----------
spring.datasource.hikari.pool-name=ecommerce-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null

# ---------- GraphQL ----------
spring.graphql.http.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# ---------- Actuator ----------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Smart E-Commerce System
info.app.phase=2

# ---------- Document store (mongodb-driver-sync, wired by MongoConfig) ----------
# Optional infrastructure: an unreachable server degrades reviews and access
# logging but must never stop the application from starting or serving requests.
app.mongo.uri=mongodb://localhost:27017
app.mongo.database=smart_ecommerce_db
app.mongo.review-collection=reviews
app.mongo.access-log-collection=access_logs
app.mongo.server-selection-timeout-ms=1500

# ---------- Pagination defaults for the customer catalogue ----------
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# ---------- Monitoring aspect ----------
# Invocations at or above this take a WARN line; everything else logs at DEBUG.
app.monitoring.slow-threshold-ms=500

# ---------- Caching ----------
# Cache names, bounds and TTLs are declared in CacheConfig; per-cache expiry
# cannot be expressed with a single global spec.
spring.cache.type=caffeine
management.endpoint.caches.enabled=true

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- HTTP ----------
# Catalogue pages are JSON lists that compress extremely well.
server.compression.enabled=true
server.compression.mime-types=application/json,application/graphql-response+json,text/plain
server.compression.min-response-size=1024
