# ============================================================
# PROD — every secret injected from the environment
# ============================================================
# No credential is hard-coded here. Startup fails loudly on a missing variable,
# which is the intended behaviour: it is safer than silently falling back to a
# development database.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# `validate` only. Schema changes ship as reviewed migrations, never as an
# automatic ALTER issued by the application at boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.leak-detection-threshold=30000

# The interactive GraphQL console and schema printer are development tools.
spring.graphql.graphiql.enabled=false
spring.graphql.schema.printer.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.rw.smart.ecommerce=INFO

app.mongo.uri=${MONGO_URI}
app.mongo.database=${MONGO_DATABASE}
app.mongo.server-selection-timeout-ms=3000

# The interactive API console is a development tool; the document itself stays
# available for client generation.
springdoc.swagger-ui.enabled=false
